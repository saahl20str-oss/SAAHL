name: Supabase Keep-Alive (SAAHL + Teeb Al-Hai)

# يشتغل تلقائياً كل يوم أحد وأربعاء الساعة 00:00 UTC (مرتين بالأسبوع، كافي جداً لأن التوقف يصير بعد 7 أيام بدون نشاط)
# وتقدر تشغّله يدوياً بأي وقت من تبويب Actions بمستودعك على GitHub (زر Run workflow)
on:
  schedule:
    - cron: '0 0 * * 0,3'
  workflow_dispatch:

jobs:
  ping-saahl:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SAAHL Supabase project
        run: |
          curl -s -o /dev/null -w "SAAHL status: %{http_code}\n" \
            "${{ secrets.SAAHL_SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SAAHL_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SAAHL_SUPABASE_ANON_KEY }}"

  ping-teeb-alhai:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Teeb Al-Hai Supabase project
        run: |
          curl -s -o /dev/null -w "Teeb Al-Hai status: %{http_code}\n" \
            "${{ secrets.TEEB_SUPABASE_URL }}/rest/v1/?select=*&limit=1" \
            -H "apikey: ${{ secrets.TEEB_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.TEEB_SUPABASE_ANON_KEY }}"
